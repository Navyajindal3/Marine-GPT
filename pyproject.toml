[project]
name = "orca"
version = "0.1.0"
description = "ORCA - Agentic AI Marine Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.0.27",
    "pydantic>=2.0",
    "anthropic>=0.19.0",
    "langdetect>=1.0.9",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pytest>=8.0.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
